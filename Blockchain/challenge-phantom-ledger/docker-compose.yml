services:
  launcher:
    build:
      context: .
    ports:
      - "${PUBLIC_PORT}:8080"
    environment:
      - MODE=${MODE:-local}
      - FLAG_LOCAL=${FLAG_LOCAL}
      - FLAG_MIRROR=${FLAG_MIRROR}
      - LAUNCHER_PORT=8080
      - DISABLE_TICKET=true
    command: >
      sh -c '
        if [ "$MODE" = "local" ]; then
          export FLAG="$FLAG_LOCAL";
        elif [ "$MODE" = "mirror" ]; then
          export FLAG="$FLAG_MIRROR";
        else
          echo "Invalid MODE: $MODE";
          exit 1;
        fi;
        exec /entrypoint.sh
      '
    deploy:
      resources:
        limits:
          cpus: "1.0"
