services:
  launcher:
    build:
      context: .
    ports:
      - "${PUBLIC_PORT}:8080"
    environment:
      MODE: ${MODE:-local}
      FLAG_LOCAL: ${FLAG_LOCAL}
      FLAG_MIRROR: ${FLAG_MIRROR}
      LAUNCHER_PORT: "8080"
      DISABLE_TICKET: ${DISABLE_TICKET:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-16}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      SUI_CLEANUP_ON_START: ${SUI_CLEANUP_ON_START:-true}
      SUI_ISOLATION_MODE: ${SUI_ISOLATION_MODE:-private_pool}
      SUI_BLOCKED_METHODS: ${SUI_BLOCKED_METHODS:-sui_dryRunTransactionBlock,unsafe_devInspectTransactionBlock}
      SUI_ADMIN_ACCOUNTS: ${SUI_ADMIN_ACCOUNTS:-4}
      SUI_COMMITTEE_SIZE: ${SUI_COMMITTEE_SIZE:-1}
      SUI_POOL_SIZE: ${SUI_POOL_SIZE:-0}
      SUI_MAX_ACTIVE: ${SUI_MAX_ACTIVE:-0}
      SUI_GAS_BUDGET: ${SUI_GAS_BUDGET:-100000000}
      SUI_INSTANCE_TTL_SECONDS: ${SUI_INSTANCE_TTL_SECONDS:-1800}
      INSTANCE_TTL_SECONDS: ${SUI_INSTANCE_TTL_SECONDS:-1800}
      SUI_POOL_REFILL_INTERVAL: ${SUI_POOL_REFILL_INTERVAL:-5}
      RPC_PROXY_TIMEOUT: ${RPC_PROXY_TIMEOUT:-120}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-5}
    command: >
      sh -c '
        if [ "$$MODE" = "local" ]; then
          selected_flag="$$FLAG_LOCAL";
        elif [ "$$MODE" = "mirror" ]; then
          selected_flag="$$FLAG_MIRROR";
        else
          echo "Invalid MODE: $$MODE";
          exit 1;
        fi;
        if [ -z "$$selected_flag" ]; then
          echo "Flag for MODE=$$MODE is empty";
          exit 1;
        fi;
        printf "%s\n" "$$selected_flag" > /flag.txt;
        export FLAG="$$selected_flag";
        exec bash /entrypoint.sh
      '
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped
